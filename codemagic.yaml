workflows:
  ios-release:
    name: iOS release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # References the App Store Connect integration named "<code magic>" in
    # this Codemagic team's settings (Teams -> Integrations -> App Store
    # Connect). Nothing here is a credential -- the integration itself
    # holds the API key, configured once in Codemagic's UI, never in this
    # file. Required for both automatic code signing (environment.ios_signing
    # below) and publishing (publishing.app_store_connect below) to know
    # which Apple account to act as.
    integrations:
      app_store_connect: "<code magic>"

    environment:
      ios_signing:
        # Automatic signing: Codemagic fetches or generates the matching
        # certificate and provisioning profile itself via the integration
        # above, scoped to this bundle ID. No certificate, private key, or
        # profile is stored anywhere -- manual signing (env-var-supplied
        # certificates/profiles) was deliberately not used, since it would
        # mean a signing credential has to live in a Codemagic group
        # instead of just an account-level integration reference.
        distribution_type: app_store
        bundle_identifier: com.kitescheduling.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20.19.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      - name: Sync Capacitor iOS
        # Copies dist/ into ios/App/App/public, regenerates
        # ios/App/App/capacitor.config.json from capacitor.config.json at
        # the repo root, and rewrites ios/App/Podfile's plugin pod entries
        # from whatever is in package.json. All three are gitignored
        # precisely because this step regenerates them on every build --
        # see ios/.gitignore. This also runs `pod install` itself once the
        # Podfile is updated; the explicit step below is a harmless,
        # idempotent safety net, not strictly required.
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set up iOS code signing
        # Reads environment.ios_signing (distribution_type +
        # bundle_identifier) and the App Store Connect integration above to
        # fetch/create the right certificate and profile, then applies them
        # to the Xcode project.
        script: |
          xcode-project use-profiles

      - name: Increment build number
        # $BUILD_NUMBER is Codemagic's own per-workflow build counter, not
        # an App Store Connect lookup -- deliberately not
        # `app-store-connect get-latest-app-store-build-number`, which
        # requires the app's numeric Apple ID (assigned once the app first
        # exists in App Store Connect, which it doesn't yet). Strictly
        # increasing per build is all TestFlight actually requires; switch
        # to the App Store Connect lookup later if build numbers ever need
        # to track the App Store Connect record itself rather than
        # Codemagic's own count.
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build .ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
