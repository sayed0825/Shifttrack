workflows:
  ios-release:
    name: iOS release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # References the App Store Connect integration named "code magic" in
    # this Codemagic team's settings (Teams -> Integrations -> App Store
    # Connect). Nothing here is a credential -- the integration itself
    # holds the API key, configured once in Codemagic's UI, never in this
    # file. Required for both automatic code signing (environment.ios_signing
    # below) and publishing (publishing.app_store_connect below) to know
    # which Apple account to act as.
    integrations:
      app_store_connect: "code magic"

    environment:
      ios_signing:
        # UI-managed signing: the certificate and App Store provisioning
        # profile for this bundle ID were generated through Codemagic's UI
        # (Team settings -> Code signing identities) and are stored there,
        # not in this repo. This block just tells Codemagic which stored
        # identity to inject into the build before any script runs --
        # `xcode-project use-profiles` (below) is what actually applies it
        # to the Xcode project. Deliberately not combined with the CLI
        # `app-store-connect fetch-signing-files` approach: Codemagic
        # documents the two as alternatives, and combining them fails --
        # fetch-signing-files --create found the certificate already sitting
        # in the Apple account (created via the UI) and tried to save it
        # locally without a private key, which Apple never re-releases once
        # a certificate exists ("Cannot save Signing Certificates without
        # certificate private key").
        distribution_type: app_store
        bundle_identifier: com.kitescheduling.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20.19.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      - name: Sync Capacitor iOS
        # Copies dist/ into ios/App/App/public, regenerates
        # ios/App/App/capacitor.config.json from capacitor.config.json at
        # the repo root, and rewrites ios/App/Podfile's plugin pod entries
        # from whatever is in package.json. All three are gitignored
        # precisely because this step regenerates them on every build --
        # see ios/.gitignore. This also runs `pod install` itself once the
        # Podfile is updated; the explicit step below is a harmless,
        # idempotent safety net, not strictly required.
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set up iOS code signing
        # Applies the certificate/profile Codemagic already injected from
        # the UI-managed code signing identity (environment.ios_signing
        # above) to the Xcode project.
        script: |
          xcode-project use-profiles

      - name: Increment build number
        # $BUILD_NUMBER is Codemagic's own per-workflow build counter, not
        # an App Store Connect lookup -- deliberately not
        # `app-store-connect get-latest-app-store-build-number`, which
        # requires the app's numeric Apple ID (the App Store Connect
        # resource ID, not the bundle identifier). The app record exists
        # in App Store Connect now, so that ID does exist -- it just isn't
        # in this file. Strictly increasing per build is all TestFlight
        # actually requires, so this needs no lookup at all; switch to the
        # App Store Connect version later if build numbers ever need to
        # track that record itself rather than Codemagic's own count.
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build .ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Uploading to App Store Connect already makes the build available
        # to internal testers as soon as it finishes processing -- no
        # review needed. submit_to_testflight additionally submits the
        # build for TestFlight *beta app review*, which is only required
        # for external testers/groups. We only use internal testers during
        # development, and Apple rejects a second review submission while
        # one is already pending (422 "Another build is in review"), which
        # Codemagic reports as a failed build even though compile + upload
        # succeeded. false is also this key's documented default; set
        # explicitly here so it's not mistaken for an oversight.
        submit_to_testflight: false
