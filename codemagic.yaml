workflows:
  ios-release:
    name: iOS release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # References the App Store Connect integration named "code magic" in
    # this Codemagic team's settings (Teams -> Integrations -> App Store
    # Connect). Nothing here is a credential -- the integration itself
    # holds the API key, configured once in Codemagic's UI, never in this
    # file. Required for both automatic code signing (environment.ios_signing
    # below) and publishing (publishing.app_store_connect below) to know
    # which Apple account to act as.
    integrations:
      app_store_connect: "code magic"

    environment:
      ios_signing:
        # This alone does not create anything -- it only tells
        # `xcode-project use-profiles` (below) which existing certificate/
        # profile to look for and apply. The first time a bundle ID is
        # built, nothing exists yet to find; see "Fetch or create signing
        # files", the step that actually generates them via the App Store
        # Connect integration above. No certificate, private key, or
        # profile is stored anywhere in this file or a Codemagic group --
        # both steps authenticate purely through the integration.
        distribution_type: app_store
        bundle_identifier: com.kitescheduling.app
      vars:
        # Must match environment.ios_signing.bundle_identifier above --
        # YAML config fields and shell script vars can't share one
        # definition, so this is the one place that duplication is
        # unavoidable.
        BUNDLE_ID: "com.kitescheduling.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20.19.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      - name: Sync Capacitor iOS
        # Copies dist/ into ios/App/App/public, regenerates
        # ios/App/App/capacitor.config.json from capacitor.config.json at
        # the repo root, and rewrites ios/App/Podfile's plugin pod entries
        # from whatever is in package.json. All three are gitignored
        # precisely because this step regenerates them on every build --
        # see ios/.gitignore. This also runs `pod install` itself once the
        # Podfile is updated; the explicit step below is a harmless,
        # idempotent safety net, not strictly required.
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Fetch or create signing files
        # environment.ios_signing / `use-profiles` only ever FETCH an
        # existing certificate and provisioning profile -- they do not
        # create one that doesn't exist yet. The App ID is registered in
        # the Apple Developer portal and the app record exists in App
        # Store Connect, but no certificate or profile has ever been
        # created for it, so without this step `use-profiles` fails with
        # "No matching profiles found". --create makes this idempotent:
        # once a certificate/profile exist, later runs just fetch them.
        # No explicit --issuer-id/--key-id/--private-key -- authenticates
        # via the same App Store Connect integration referenced above,
        # exactly like `use-profiles` does.
        script: |
          app-store-connect fetch-signing-files \
            --type IOS_APP_STORE \
            --create \
            "$BUNDLE_ID"

      - name: Set up iOS code signing
        # Applies the certificate/profile fetch-signing-files just
        # ensured exist to the Xcode project.
        script: |
          xcode-project use-profiles

      - name: Increment build number
        # $BUILD_NUMBER is Codemagic's own per-workflow build counter, not
        # an App Store Connect lookup -- deliberately not
        # `app-store-connect get-latest-app-store-build-number`, which
        # requires the app's numeric Apple ID (the App Store Connect
        # resource ID, not the bundle identifier). The app record exists
        # in App Store Connect now, so that ID does exist -- it just isn't
        # in this file. Strictly increasing per build is all TestFlight
        # actually requires, so this needs no lookup at all; switch to the
        # App Store Connect version later if build numbers ever need to
        # track that record itself rather than Codemagic's own count.
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build .ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
